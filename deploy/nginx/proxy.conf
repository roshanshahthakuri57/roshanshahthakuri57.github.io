# DMZ edge: the only container reachable from outside. Forwards GET/HEAD to `web` and nothing else.
limit_req_zone $binary_remote_addr zone=site:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server_tokens off;

server {
  listen 8080;
  server_name _;

  limit_conn perip 20;
  limit_req zone=site burst=40 nodelay;
  client_max_body_size 1k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 15s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location / {
    limit_except GET HEAD { deny all; }
    proxy_pass http://web:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }
}
